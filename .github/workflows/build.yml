name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Descomprimir proyecto
        run: |
          unzip -q proyecto.zip -d src
          PROJ=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Compilar APK debug
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MiMTB-GPS-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
